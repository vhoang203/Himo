<style>

/* ---- đầu trang */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}

.item .t{flex:1;min-width:0}
.item .n{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .s{color:var(--soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.danger{background:var(--danger-soft);color:var(--danger)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.accent{background:var(--accent-soft);color:var(--accent)}

.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--soft);margin:0}.kv dd{margin:0;overflow-wrap:anywhere}
.quote{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}

.actions .btn.danger small,.actions .btn.primary small{color:inherit;opacity:.85}
.hint{color:var(--soft);font-size:12.5px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

.bars{display:flex;align-items:flex-end;gap:2px;height:64px}

/* ---- bảng phân tích (081) */
:root{--pt-s1:#2a78d6;--pt-s2:#1baf7a;--pt-s3:#6250d6;--pt-sneg:#A0937F}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pt-s1:#3987e5;--pt-s2:#199e70;--pt-s3:#9085e9;--pt-sneg:#7A6C5E}}

/* 19/11 — dashboard Tổng quan: 8 màu phân loại theo thứ tự cố định (kiểu Tableau, slot 2 = cam HIMO); đã chạy bộ kiểm mù màu
   (validate_palette: nền sáng #fff và nền tối #1B1815 đều ĐẠT; ba màu sáng dưới 3:1 → luôn có chú giải kèm số). Màu trạng thái giữ riêng. */
:root{--tq-ok1:#1E9E58;--tq-ok2:#8CD3A8;--tq-1:#2a78d6;--tq-2:#e5672f;--tq-3:#1baf7a;--tq-4:#eda100;--tq-5:#e87ba4;--tq-6:#008300;--tq-7:#6250d6;--tq-8:#e34948;--tq-khac:#A0937F}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--tq-ok1:#4CCB7A;--tq-ok2:#2E7A4E;--tq-1:#3987e5;--tq-2:#de5013;--tq-3:#199e70;--tq-4:#c98500;--tq-5:#d55181;--tq-6:#0ca30c;--tq-7:#9085e9;--tq-8:#e66767;--tq-khac:#7A6C5E}}
:root[data-theme=dark]{--tq-ok1:#4CCB7A;--tq-ok2:#2E7A4E;--tq-1:#3987e5;--tq-2:#de5013;--tq-3:#199e70;--tq-4:#c98500;--tq-5:#d55181;--tq-6:#0ca30c;--tq-7:#9085e9;--tq-8:#e66767;--tq-khac:#7A6C5E}
.tq-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tq-kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 8px;box-shadow:var(--shadow);overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:3px}
.tq-kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.tq-kpi[data-go]{cursor:pointer}.tq-kpi[data-go]:hover{border-color:var(--line2)}.tq-kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tq-kl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--mid)}.tq-kl i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

.tq-the{min-width:0;display:flex;flex-direction:column;gap:8px}
.tq-c4{grid-column:span 4}.tq-c6{grid-column:span 6}.tq-c8{grid-column:span 8}.tq-c12{grid-column:1/-1}
@media(max-width:1180px){.tq-c4,.tq-c8{grid-column:span 6}}
@media(max-width:780px){.tq-c4,.tq-c6,.tq-c8{grid-column:1/-1}}
.tq-th{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.tq-th h2,.tq-th h3{font-size:15px;margin:0}.tq-th .hint{display:block;margin:2px 0 0}

.tq-h3{font-size:13px;font-weight:700;color:var(--mid);margin:0 0 8px}

.tq-dl b{font-variant-numeric:tabular-nums}.tq-dl small{color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}

#lamMoi{padding:6px 9px;min-height:30px;font-size:15px;line-height:1}
/* công tắc sáng / tối: nền sáng hiện mặt trăng (bấm → tối), nền tối hiện mặt trời (bấm → sáng) */
.theme-sw{padding:6px 8px;min-height:30px}
.theme-sw svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.theme-sw .i-sang{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .theme-sw .i-sang{display:block}:root:not([data-theme=light]) .theme-sw .i-toi{display:none}}
:root[data-theme=dark] .theme-sw .i-sang{display:block}:root[data-theme=dark] .theme-sw .i-toi{display:none}
@media(max-width:520px){.fresh{font-size:0;gap:0}}
.who .btn{white-space:nowrap;flex:none}
@media(max-width:520px){.brand small{display:none}.who{gap:6px}}
@media(min-width:1100px){
  .wrap{max-width:1520px;padding:0 28px 72px;display:grid;grid-template-columns:232px minmax(0,1fr);column-gap:32px;grid-template-areas:"top top" "nav main";align-items:start}
  .top{grid-area:top;position:sticky;top:0;z-index:25;background:var(--ground);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
  .gnav{grid-area:nav;position:sticky;top:78px;flex-direction:column;gap:2px;border-bottom:0;margin:0;padding:0 2px 24px;max-height:calc(100vh - 96px);overflow-x:hidden;overflow-y:auto}
  .snav{display:none!important}
  #main{grid-area:main;min-width:0}
  #main>.stack:first-child,#main>.cols{padding-top:0!important}
  .tab{width:100%;padding:9px 12px;border-radius:10px;border-bottom:0;margin:0;gap:10px;text-align:left;flex:none}
  .tab svg{display:block}
  .tab .tab-t{flex:1}
  .tab:hover{background:var(--surface2);color:var(--ink)}
  .tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border-bottom-color:transparent}
  .tab[aria-selected=true] svg{color:var(--primary)}
  .gsec{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:18px 12px 6px}
  .gsubs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 20px;padding-left:10px;border-left:1.5px solid var(--line2)}
  .gsub{border:0;background:none;text-align:left;padding:6px 10px;border-radius:8px;color:var(--soft);font-size:13.5px;font-weight:600}
  .gsub:hover{background:var(--surface2);color:var(--ink)}
  .gsub[aria-current=true]{color:var(--primary);background:var(--primary-soft)}
}
/* ---- chân dung người dùng (167) */
.cd-loc{display:flex;flex-direction:column;gap:10px}
.cd-lr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.cd-lb{font-size:11.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;padding-top:8px}
@media(max-width:640px){.cd-lr{grid-template-columns:1fr;gap:4px}.cd-lb{padding-top:0}}
.cd-loc .chip{padding:5px 11px;font-size:12.5px}
.cd-loc .chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.cd-loc select{border:1px solid var(--line2);border-radius:999px;padding:5px 10px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;min-height:31px;max-width:100%}
.cd-loc details>summary{cursor:pointer;color:var(--mid);font-size:13px;font-weight:700}
.cd-ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mid);padding:5px 4px}
.cd-tom{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:13.5px;color:var(--mid);min-height:32px}
.cd-tom b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.cd-x{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--primary-soft);color:var(--primary);border:0;padding:5px 11px;font-size:12.5px;font-weight:700}
.cd-x:hover{filter:brightness(.92)}
.cd-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.cd-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1560px){.cd-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cd-rows{display:flex;flex-direction:column;gap:1px}
.cd-row{display:grid;grid-template-columns:minmax(80px,34%) minmax(0,1fr) 54px 52px;gap:10px;align-items:center;border:0;background:none;color:inherit;text-align:left;padding:5px 6px;border-radius:8px;width:100%;font:inherit;font-size:13px;outline:none}
button.cd-row{cursor:pointer}
.cd-row:hover,.cd-row:focus-visible{background:var(--surface2)}
.cd-row[aria-pressed=true]{background:var(--primary-soft)}
.cd-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mid)}
.cd-b{display:block;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.cd-b i{display:block;height:100%;border-radius:5px}
.cd-p{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd-n{color:var(--soft);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd-row.it .cd-b{background:repeating-linear-gradient(135deg,var(--surface2) 0 5px,var(--surface3) 5px 10px)}
.cd-row.it .cd-p{font-weight:600;color:var(--faint)}
.cd-row.tien{grid-template-columns:minmax(80px,38%) minmax(0,1fr) minmax(64px,auto) 46px}
/* ---- doanh thu theo kỳ (202) — chỉ áp TRONG khối .dtk, không đổi kiểu của thẻ nào khác.
   Chữ phụ và nhãn trục dùng --mid (đủ 4,5:1 trên cả nền sáng lẫn tối); nút đang chọn / nút chính dùng cam đậm cố định để chữ trắng đủ 4,5:1 ở nền tối. */
.dtk .hint,.dtk .cd-lb,.dtk .tbl th{color:var(--mid)}
.dtk .pt-dtot{color:color-mix(in srgb,var(--ok) 60%,var(--ink))}.dtk .pt-dxau{color:color-mix(in srgb,var(--danger) 66%,var(--ink))}
.dtk .pt-ax{fill:var(--mid)}
.dtk .cd-loc .chip[aria-pressed=true],.dtk .btn.primary{background:#C9440E;border-color:#C9440E;color:#fff}
.dtk .cd-row.tien{grid-template-columns:minmax(0,1fr) auto;row-gap:6px;padding:7px 6px}
.dtk .cd-row.tien .cd-l{white-space:normal;overflow:visible;color:var(--ink);font-variant-numeric:tabular-nums}
.dtk .cd-row.tien .cd-b{grid-column:1 / -1}
.dtk .cd-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dtk-mt-t{color:var(--mid);font-size:12px;margin-left:8px;white-space:nowrap}
.dtk>.card,.dtk>.alertbar{margin-top:12px}
.dtk .tbl tbody th{font-weight:400;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink)}
.dtk .sec{flex-wrap:wrap}.dtk .sec h2{white-space:nowrap}
.dt-tiles{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.dt-tiles .v{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-tt{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}
.cd-tt:first-child{padding-top:2px}.cd-tt:last-child{border-bottom:0;padding-bottom:2px}
.cd-tt-h{font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.cd-stack{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden}
.cd-stack i{display:block;min-width:3px;outline:none}
.cd-stack i:hover,.cd-stack i:focus-visible{filter:brightness(1.12)}
.cd-tt-c{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mid)}
.cd-tt-c span{display:inline-flex;align-items:center;gap:6px}
.cd-tt-c b{color:var(--ink);font-variant-numeric:tabular-nums}
/* ---- sức chứa & nâng cấp (218) — chữ luôn màu chữ; xanh / vàng / đỏ chỉ ở nhãn trạng thái và thanh %, luôn kèm chữ */
.sc-nguon{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--mid)}
.sc-ng{display:inline-flex;align-items:center;gap:6px}.sc-ng i{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.sc-ng i.ok{background:var(--ok)}.sc-ng i.warn{background:var(--warn)}
.sc-nhom{display:flex;flex-direction:column;gap:10px;scroll-margin-top:90px}
.sc-nhom>h2{font-size:17px;margin:8px 0 0;border-bottom:2px solid var(--line2);padding-bottom:6px}
.sc-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media(max-width:520px){.sc-luoi{grid-template-columns:1fr}}
.sc-the{display:flex;flex-direction:column;gap:8px;min-width:0;scroll-margin-top:110px}
.sc-the.sc-do{border-color:var(--danger)}
.sc-dau{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.sc-dau h3{font-size:14.5px;margin:0;line-height:1.35}.sc-dau .tag{flex:none}
.sc-so{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sc-so b{font-size:17px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sc-so span{font-size:13px;font-weight:700;color:var(--mid);font-variant-numeric:tabular-nums}
.sc-thanh{position:relative;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.sc-thanh i{display:block;height:100%;border-radius:4px}
.sc-thanh s{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.sc-phu{margin:0;font-size:12.5px;color:var(--mid);line-height:1.45}
.sc-chua{margin:0;font-size:13px;color:var(--mid);background:var(--surface2);border-radius:10px;padding:9px 11px;line-height:1.45}
.sc-it{margin:0}
.sc-viec{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.sc-viec>b{font-size:11.5px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.sc-chan{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:2px}.sc-chan .hint{font-size:12px}
.sc-ba small{display:block}
.sc-bao-dong a{font-weight:700}
.sc-tbl td{white-space:normal}.sc-tbl td:first-child{white-space:nowrap}
</style>
</head>
<body>
<!-- ===================== ĐĂNG NHẬP ===================== -->
<div id="login" class="login" hidden>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <a class="brand" href="index.html"><picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="logo.svg" alt="HIMO" width="91" height="30"></picture> <small id="lgBrand">Quản trị</small></a>
      <span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn ghost sm theme-sw" type="button" title="Đổi nền sáng / tối" aria-label="Đổi nền sáng / tối"><svg class="i-toi" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="i-sang" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button><span id="langSw2" class="langsw"></span></span>
    </div>
    <p class="hint" id="lgHint">Chỉ tài khoản quản trị viên mới vào được. Mọi thao tác đều được ghi lại.</p>
    <form id="loginForm">
      <label for="email" id="lgEmail">Email</label>
      <input class="text" id="email" type="email" autocomplete="username" required>
      <label for="pw" id="lgPw">Mật khẩu</label>
      <input class="text" id="pw" type="password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <div class="hint" id="loginNote" hidden></div>
      <button class="btn primary" type="submit" id="loginBtn" style="width:100%;margin-top:4px">Đăng nhập</button>
      <button class="btn ghost sm" type="button" id="lgForgot" style="width:100%;margin-top:8px">Quên mật khẩu?</button>
    </form>
  </div>
</div>

<!-- ===================== ỨNG DỤNG ===================== -->
<div id="app" class="wrap" hidden>
  <header class="top">
    <a class="brand" href="#"><picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="logo.svg" alt="HIMO" width="91" height="30"></picture> <small id="appBrand">Quản trị</small></a>
    <div class="who"><button class="btn ghost sm theme-sw" type="button" title="Đổi nền sáng / tối" aria-label="Đổi nền sáng / tối"><svg class="i-toi" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="i-sang" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button><span id="langSw" class="langsw"></span><span id="freshness" class="fresh" title="Trang tự làm mới mỗi phút"></span><button class="btn ghost sm" id="lamMoi" type="button" title="Làm mới số liệu ngay" aria-label="Làm mới số liệu ngay">↻</button><span id="whoEmail"></span><button class="btn ghost sm" id="logout">Đăng xuất</button></div>
  </header>
  <nav class="gnav" role="tablist" id="gnav"></nav>
  <nav class="snav" id="snav" hidden></nav>
  <main id="main"></main>
</div>

<div id="toast" class="toast" hidden></div>
<div id="modalScrim" class="scrim" hidden><div class="modal" id="modal"></div></div>
<div id="lightbox" class="lightbox" hidden><button class="x" id="lbClose">Đóng</button><img id="lbImg" alt=""></div>
