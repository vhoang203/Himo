<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản trị · HIMO</title>
<meta name="robots" content="noindex, nofollow">
<!-- Hàng rào chống rò dữ liệu: kể cả khi có kẻ chèn được mã lạ vào trang này,
     trình duyệt cũng chỉ cho phép gửi dữ liệu tới đúng máy chủ Supabase của HIMO
     (ghim đúng tên dự án, không dùng *.supabase.co — dấu * cho phép gửi sang dự án
     Supabase của kẻ khác). frame-ancestors trong <meta> bị trình duyệt bỏ qua, nên
     admin.js tự thoát khi bị nhúng trong khung (GitHub Pages không đặt được header).
     Mã chỉ được tải từ chính trang này (script-src 'self', không inline, không CDN):
     supabase-js được tự lưu trữ và ghim phiên bản 2.115.0 (cùng tệp với website);
     phần mã của trang nằm trong admin.js / admin-en.js / admin-en1.js. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com data:;
  img-src 'self' data: blob: https://ygestzkubyhprsiuzhmi.supabase.co;
  connect-src https://ygestzkubyhprsiuzhmi.supabase.co wss://ygestzkubyhprsiuzhmi.supabase.co;
  form-action 'none';
  base-uri 'none';
  frame-ancestors 'none';
">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{--ground:#FBF7F2;--surface:#fff;--surface2:#F5EDE4;--surface3:#ECE1D5;--ink:#1E1712;--mid:#524840;--soft:#82756A;--faint:#A0937F;--line:#EBE1D6;--line2:#D9CCBE;--primary:#C9440E;--primary-ink:#fff;--primary-soft:rgba(201,68,14,.10);--accent:#B8651C;--accent-soft:rgba(184,101,28,.12);--ok:#1E9E58;--ok-soft:rgba(30,158,88,.12);--warn:#B8791A;--warn-soft:rgba(184,121,26,.14);--danger:#D6403A;--danger-soft:rgba(214,64,58,.10);--shadow:0 2px 10px rgba(42,26,16,.06);--overlay:rgba(30,23,18,.45)}
@media(prefers-color-scheme:dark){:root{--ground:#12100E;--surface:#1B1815;--surface2:#262119;--surface3:#332B23;--ink:#F6F0E8;--mid:#D2C8BC;--soft:#9A8D7F;--faint:#7A6C5E;--line:#2A2420;--line2:#3D332A;--primary:#DE5013;--primary-soft:rgba(222,80,19,.18);--accent:#F2A64B;--accent-soft:rgba(242,166,75,.16);--ok:#4CCB7A;--ok-soft:rgba(76,203,122,.16);--warn:#F5C25B;--warn-soft:rgba(245,194,91,.16);--danger:#FF6B5E;--danger-soft:rgba(255,107,94,.16);--shadow:none;--overlay:rgba(0,0,0,.62)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}button{font:inherit;cursor:pointer}input,textarea,select{font:inherit}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 60px}
/* ---- đầu trang */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{display:block;height:30px;width:auto;flex:none}
.brand small{font-weight:600;color:var(--soft);font-size:13px;margin-left:2px;white-space:nowrap}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:520px){.who span{display:none}}
.langsw{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.lang{background:transparent;border:0;padding:4px 8px;font-size:11.5px;font-weight:800;color:var(--soft);letter-spacing:.03em}
.lang.on{background:var(--ink);color:var(--ground)}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.fresh::before{content:'';width:7px;height:7px;border-radius:50%;background:#3F9A62;flex:none}
.fresh.busy::before{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.fresh.stale::before{background:var(--soft)}
@keyframes pulse{50%{opacity:.25}}
/* ---- tab */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:12px 12px;color:var(--soft);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--primary)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.badge.neutral{background:var(--surface3);color:var(--mid)}
/* ---- bố cục hai cột */
.cols{display:grid;grid-template-columns:1fr;gap:18px;padding-top:16px}
@media(min-width:920px){.cols{grid-template-columns:minmax(0,1fr) 460px}.cols.wide{grid-template-columns:1fr}.pane{align-self:start}}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:0}
.sub{color:var(--soft);font-size:13px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
/* ---- nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:700;font-size:13.5px;min-height:38px}
.btn:hover{background:var(--surface2)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.danger.fill{background:var(--danger);color:#fff}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mid)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12.5px;border-radius:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--mid);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
/* ---- danh sách phẳng */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit;border-radius:8px}
.item:hover{background:var(--surface2)}.item[aria-current=true]{background:var(--primary-soft)}
.item:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:12px;background:var(--surface3);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--soft);font-weight:800;overflow:hidden}
.av.round{border-radius:999px}.av img{width:100%;height:100%;object-fit:cover;display:block}
.item .t{flex:1;min-width:0}
.item .n{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .s{color:var(--soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{color:var(--faint);font-size:12px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700;background:var(--surface3);color:var(--mid);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.danger{background:var(--danger-soft);color:var(--danger)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.accent{background:var(--accent-soft);color:var(--accent)}
/* ---- chi tiết */
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--soft);margin:0}.kv dd{margin:0;overflow-wrap:anywhere}
.quote{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.photo{width:100%;max-width:280px;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--surface3);display:block}
.photo.sm{width:96px;height:96px;max-width:none;border-radius:10px}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);resize:vertical}
input.text{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{justify-content:flex-start;padding:10px 12px;min-height:44px;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.25}
.actions .btn small{font-weight:500;color:var(--soft);font-size:11.5px}
.actions .btn.danger small,.actions .btn.primary small{color:inherit;opacity:.85}
.hint{color:var(--soft);font-size:12.5px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface3)}
.pcard .b{padding:8px 10px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.pcard .r{display:flex;gap:6px}
.pcard .r .btn{flex:1;min-height:32px;padding:5px 6px;font-size:12px}
/* ---- số liệu */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tile .l{color:var(--soft);font-size:12.5px;margin-top:2px}
.tile.alert .v{color:var(--danger)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chart h3{margin:0 0 2px;font-size:13px;font-weight:700}
.chart .sum{color:var(--soft);font-size:12px;margin-bottom:8px}
.bars{display:flex;align-items:flex-end;gap:2px;height:64px}
.bars i{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-height:1px;opacity:.85;position:relative}.bars i.zero{background:var(--line2);opacity:1}
.bars i:hover{opacity:1}
.bars i b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;display:none;margin-bottom:4px;font-weight:600}
.bars i:hover b{display:block}
.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:4px}
/* ---- toast / modal / đăng nhập */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:60;max-width:92vw}
.toast.err{background:var(--danger);color:#fff}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.modal{background:var(--surface);border-radius:18px 18px 0 0;padding:18px 18px 22px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal h2{margin-bottom:6px}.modal p{margin:0 0 12px;color:var(--mid);font-size:14px}
.modal.rong{max-width:760px;max-height:88vh;overflow:auto}
.msg{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}.msg .who{font-weight:700}.msg .when{color:var(--mid);font-size:12px;margin-left:6px}
.msg .body{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.anh-rieng{display:inline-block;width:120px;height:120px;border-radius:10px;background:var(--line);margin:4px;object-fit:cover;vertical-align:top}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:380px;padding:22px}
.login label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin:12px 0 5px}
.err{color:var(--danger);font-size:13.5px;min-height:1.2em;margin-top:8px}
.empty{padding:36px 12px;text-align:center;color:var(--soft)}
.sheet-close{display:none}
@media(max-width:919px){
  .pane{position:fixed;inset:0;background:var(--ground);z-index:30;overflow:auto;padding:12px 16px 40px}
  .pane[hidden]{display:none}
  .sheet-close{display:inline-flex;margin-bottom:8px}
}

/* ---- điều hướng hai tầng */
.gnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.gnav::-webkit-scrollbar{display:none}
.snav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;margin:0}
.snav::-webkit-scrollbar{display:none}
.snav .chip{white-space:nowrap}
/* ---- bảng số liệu */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface2)}
.scrollx{overflow-x:auto;margin:0 -16px;padding:0 16px}
/* ---- thanh tỉ lệ trong bảng */
.rate{display:inline-flex;align-items:center;gap:6px;min-width:92px}
.rate i{flex:1;height:6px;border-radius:3px;background:var(--surface3);position:relative;overflow:hidden}
.rate i b{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:3px}
.rate span{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;min-width:38px;text-align:right}
.rate.thieu i b{background:var(--line2)}
/* ---- phễu */
.funnel{display:flex;flex-direction:column;gap:8px}
.fstep{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.fstep .bar{height:26px;border-radius:7px;background:var(--surface3);overflow:hidden}
.fstep .bar i{display:block;height:100%;background:var(--primary);opacity:.85}
.fstep .n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
@media(max-width:560px){.fstep{grid-template-columns:110px 1fr auto;font-size:12.5px}}
/* ---- phân trang */
.pager{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px 0;color:var(--soft);font-size:13px}
/* ---- ô lọc gọn */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);font-size:13.5px;min-height:38px}
.filters input{flex:1;min-width:150px}
/* ---- khối cảnh báo */
.alertbar{display:flex;gap:10px;align-items:flex-start;background:var(--danger-soft);border:1px solid var(--danger);border-radius:12px;padding:11px 14px;font-size:13.5px}
.alertbar.warn{background:var(--warn-soft);border-color:var(--warn)}
.alertbar.ok{background:var(--ok-soft);border-color:var(--ok)}
.alertbar b{font-weight:800}
.sec{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.sec h2{font-size:15px}.sec .hint{margin:0}
/* ---- xem ảnh to */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.lightbox .x{position:absolute;top:14px;right:16px;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.photo.zoom,.pcard img.zoom{cursor:zoom-in}
.anh-hong{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--surface3);color:var(--faint);font-size:18px;flex:none}
.pcard .anh-hong,.photo ~ .anh-hong{width:100%;aspect-ratio:1;border-radius:0}
/* ---- thẻ nội dung bấm được */
.pcard.clickable{cursor:pointer;transition:transform .12s}
.pcard.clickable:hover{transform:translateY(-2px);border-color:var(--line2)}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt.reply{margin-left:34px}
.cmt .b{flex:1;min-width:0}
.cmt .b .n{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmt .b .x{font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.cmt .b .m{color:var(--faint);font-size:12px;margin-top:2px}
.likers{display:flex;flex-wrap:wrap;gap:6px}
.likers .av{width:30px;height:30px;border-radius:999px;font-size:12px}
.skeleton{height:52px;border-radius:10px;background:linear-gradient(90deg,var(--surface2),var(--surface3),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<!-- ===================== ĐĂNG NHẬP ===================== -->
<div id="login" class="login" hidden>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <a class="brand" href="index.html"><picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="logo.svg" alt="HIMO" width="91" height="30"></picture> <small id="lgBrand">Quản trị</small></a>
      <span id="langSw2" class="langsw"></span>
    </div>
    <p class="hint" id="lgHint">Chỉ tài khoản quản trị viên mới vào được. Mọi thao tác đều được ghi lại.</p>
    <form id="loginForm">
      <label for="email" id="lgEmail">Email</label>
      <input class="text" id="email" type="email" autocomplete="username" required>
      <label for="pw" id="lgPw">Mật khẩu</label>
      <input class="text" id="pw" type="password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <div class="hint" id="loginNote" hidden></div>
      <button class="btn primary" type="submit" id="loginBtn" style="width:100%;margin-top:4px">Đăng nhập</button>
      <button class="btn ghost sm" type="button" id="lgForgot" style="width:100%;margin-top:8px">Quên mật khẩu?</button>
    </form>
  </div>
</div>

<!-- ===================== ỨNG DỤNG ===================== -->
<div id="app" class="wrap" hidden>
  <header class="top">
    <a class="brand" href="#"><picture><source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="logo.svg" alt="HIMO" width="91" height="30"></picture> <small id="appBrand">Quản trị</small></a>
    <div class="who"><span id="langSw" class="langsw"></span><span id="freshness" class="fresh" title="Trang tự làm mới mỗi phút"></span><span id="whoEmail"></span><button class="btn ghost sm" id="logout">Đăng xuất</button></div>
  </header>
  <nav class="gnav" role="tablist" id="gnav"></nav>
  <nav class="snav" id="snav" hidden></nav>
  <main id="main"></main>
</div>

<div id="toast" class="toast" hidden></div>
<div id="modalScrim" class="scrim" hidden><div class="modal" id="modal"></div></div>
<div id="lightbox" class="lightbox" hidden><button class="x" id="lbClose">Đóng</button><img id="lbImg" alt=""></div>

<script src="admin-en.js"></script>
<script src="admin-en1.js"></script>
<script src="config.js"></script>
<script src="supabase-js-2.115.0.umd.js"></script>
<script src="admin.js"></script>
</body>
</html>
